<style>

@media (prefers-color-scheme: dark) {

<script>
/* -------------------------------------------------------------
   Employee of the Month — Verified Voting & Management Engine
------------------------------------------------------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function toast(t) {
  const e = $('toast');
  e.textContent = t;
  e.className = 's';
  clearTimeout(e._t);
  e._t = setTimeout(() => e.className = '', 3500);
}
const err = e => toast((e && e.message || String(e)).replace(/^Error:\s*/, ''));

const getMonthStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
};

// Initial Seed Data
const DEFAULT_DATA = {
  admin_pin: '1234',
  rev: false,
  employees: [
    {
      id: 'e1',
      name: 'Sarah Chen',
      role: 'Lead UI/UX Designer',
      photo: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=300&auto=format&fit=crop&q=80',
      pin: '1111',
      created_at: 1000
    },
    {
      id: 'e2',
      name: 'Marcus Johnson',
      role: 'Senior Backend Engineer',
      photo: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80',
      pin: '1111',
      created_at: 2000
    },
    {
      id: 'e3',
      name: 'Priya Sharma',
      role: 'Customer Success Lead',
      photo: 'https://images.unsplash.com/photo-1580489944761-15a19d654956?w=300&auto=format&fit=crop&q=80',
      pin: '1111',
      created_at: 3000
    },
    {
      id: 'e4',
      name: 'Alex Rivera',
      role: 'DevOps & Cloud Architect',
      photo: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300&auto=format&fit=crop&q=80',
      pin: '1111',
      created_at: 4000
    }
  ],
  ballots: [],
  feedback: []
};

// Robust Storage Engine with Quota Protection
const DB = {
  get() {
    try {
      const raw = localStorage.getItem('eom_db_v2');
      if (!raw) {
        // Check v1 migration if present
        const oldRaw = localStorage.getItem('eom_db_v1');
        let initial = DEFAULT_DATA;
        if (oldRaw) {
          try {
            const old = JSON.parse(oldRaw);
            if (old.employees && old.employees.length) {
              initial.employees = old.employees;
            }
          } catch(e) {}
        }
        localStorage.setItem('eom_db_v2', JSON.stringify(initial));
        return JSON.parse(JSON.stringify(initial));
      }
      return JSON.parse(raw);
    } catch(e) {
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }
  },
  save(data) {
    try {
      localStorage.setItem('eom_db_v2', JSON.stringify(data));
      return true;
    } catch(e) {
      console.warn('Storage quota warning, optimizing images...', e);
      try {
        // Compress base64 if quota is hit
        data.employees.forEach(emp => {
          if (emp.photo && emp.photo.length > 25000) {
            emp.photo = ''; // Reset large photo to prevent storage failure
          }
        });
        localStorage.setItem('eom_db_v2', JSON.stringify(data));
        return true;
      } catch(e2) {
        toast('Warning: Browser storage is full. Please clear some browser cache.');
        return false;
      }
    }
  },
  reset() {
    localStorage.removeItem('eom_db_v2');
    return this.get();
  }
};

// Support for sharing roster in URL hash so WhatsApp links share the latest employees
function syncRosterFromUrl() {
  if (window.location.hash.startsWith('#r=')) {
    try {
      const b64 = decodeURIComponent(window.location.hash.slice(3));
      const json = decodeURIComponent(escape(atob(b64)));
      const incoming = JSON.parse(json);
      if (Array.isArray(incoming) && incoming.length > 0) {
        const db = DB.get();
        incoming.forEach(inc => {
          const found = db.employees.find(e => e.id === inc.id || e.name.toLowerCase() === inc.name.toLowerCase());
          if (!found) {
            db.employees.push(inc);
          } else {
            found.role = inc.role || found.role;
            if (inc.photo) found.photo = inc.photo;
          }
        });
        DB.save(db);
      }
    } catch(e) {
      console.warn('Could not sync roster from URL', e);
    }
  }
}

// Generate shareable URL with current employee names & roles
function getShareUrl() {
  const db = DB.get();
  const minimalRoster = db.employees.map(e => ({
    id: e.id,
    name: e.name,
    role: e.role,
    photo: e.photo && e.photo.startsWith('http') ? e.photo : ''
  }));
  try {
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(minimalRoster))));
    return window.location.origin + window.location.pathname + '#r=' + encodeURIComponent(b64);
  } catch(e) {
    return window.location.href.split('#')[0];
  }
}

// Image compression utility: squares & crops to 150x150 JPEG (~6KB)
function compressImage(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve('');
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Failed to read file'));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error('Invalid image file'));
      img.onload = () => {
        const size = 150;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const minDim = Math.min(img.width, img.height);
        const sx = (img.width - minDim) / 2;
        const sy = (img.height - minDim) / 2;
        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
        resolve(dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Serverless-style RPC calls over local database
const RPC = {
  pub() {
    const db = DB.get();
    const curMonth = getMonthStr();
    const monthBallots = db.ballots.filter(b => b.month === curMonth);
    const counts = {};
    monthBallots.forEach(b => { counts[b.cid] = (counts[b.cid] || 0) + 1; });
    return {
      m: curMonth,
      rev: !!db.rev,
      total: monthBallots.length,
      counts: db.rev ? counts : {},
      emps: db.employees
    };
  },
  
  empLogin(p_eid, p_pin) {
    const db = DB.get();
    const emp = db.employees.find(e => e.id === p_eid);
    if (!emp) throw new Error('Employee not found');
    const enteredPin = String(p_pin || '').trim();
    const targetPin = String(emp.pin || '1111').trim();
    if (enteredPin !== targetPin && enteredPin !== String(db.admin_pin)) {
      throw new Error('Wrong employee PIN. Default is 1111');
    }
    const curMonth = getMonthStr();
    const vote = db.ballots.find(b => b.month === curMonth && b.voter_id === emp.id);
    return {
      emp,
      hasVoted: !!vote,
      votedFor: vote ? vote.cname : null,
      votedTime: vote ? vote.timestamp : null
    };
  },

  empVote(p_voter_id, p_cid) {
    const db = DB.get();
    const curMonth = getMonthStr();
    const voter = db.employees.find(e => e.id === p_voter_id);
    if (!voter) throw new Error('Please log in as an employee first');
    if (p_voter_id === p_cid) throw new Error('You cannot vote for yourself!');
    
    const existing = db.ballots.find(b => b.month === curMonth && b.voter_id === p_voter_id);
    if (existing) throw new Error('You have already voted this month');

    const candidate = db.employees.find(e => e.id === p_cid);
    if (!candidate) throw new Error('Candidate not found');

    const d = new Date();
    const timeStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
                    d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

    db.ballots.push({
      month: curMonth,
      voter_id: voter.id,
      voter_name: voter.name,
      cid: candidate.id,
      cname: candidate.name,
      timestamp: timeStr
    });

    DB.save(db);
    return { candidateName: candidate.name, timeStr };
  },

  fb(p_voter_id, p_eid, p_kind, p_text) {
    const text = String(p_text || '').trim();
    if (!text) throw new Error('Please write something');
    const db = DB.get();
    const voter = db.employees.find(e => e.id === p_voter_id);
    db.feedback.push({
      month: getMonthStr(),
      eid: p_eid,
      voter_name: voter ? voter.name : 'Staff Member',
      kind: p_kind === 'suggestion' ? 'suggestion' : 'compliment',
      text: text.slice(0, 600),
      timestamp: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
    });
    DB.save(db);
    return true;
  },

  adm(p_pin) {
    const db = DB.get();
    if (String(p_pin || '').trim() !== String(db.admin_pin)) {
      throw new Error('Wrong admin PIN. Default is 1234');
    }
    const curMonth = getMonthStr();
    const monthBallots = db.ballots.filter(b => b.month === curMonth);
    const counts = {};
    monthBallots.forEach(b => { counts[b.cid] = (counts[b.cid] || 0) + 1; });
    
    // Who has voted vs Who hasn't
    const votedIds = new Set(monthBallots.map(b => b.voter_id));
    const votedList = monthBallots.map(b => ({
      voter_id: b.voter_id,
      voter_name: b.voter_name,
      cid: b.cid,
      cname: b.cname,
      timestamp: b.timestamp
    }));
    const pendingList = db.employees.filter(e => !votedIds.has(e.id)).map(e => ({
      id: e.id,
      name: e.name,
      role: e.role
    }));

    const fbList = db.feedback.filter(f => f.month === curMonth);

    return {
      counts,
      total: monthBallots.length,
      employees: db.employees,
      votedList,
      pendingList,
      fb: fbList
    };
  },

  addEmp(p_pin, p_name, p_role, p_photo) {
    const db = DB.get();
    if (String(p_pin || '').trim() !== String(db.admin_pin)) throw new Error('Wrong admin PIN');
    const name = String(p_name || '').trim();
    if (!name) throw new Error('Employee name is required');
    const newEmp = {
      id: 'e' + Date.now(),
      name,
      role: String(p_role || '').trim(),
      photo: String(p_photo || '').trim(),
      pin: '1111',
      created_at: Date.now()
    };
    db.employees.push(newEmp);
    DB.save(db);
    return newEmp;
  },

  editEmp(p_pin, p_id, p_name, p_role, p_photo) {
    const db = DB.get();
    if (String(p_pin || '').trim() !== String(db.admin_pin)) throw new Error('Wrong admin PIN');
    const emp = db.employees.find(e => e.id === p_id);
    if (!emp) throw new Error('Employee not found');
    const name = String(p_name || '').trim();
    if (!name) throw new Error('Employee name cannot be empty');
    
    emp.name = name;
    emp.role = String(p_role || '').trim();
    if (p_photo !== undefined) {
      emp.photo = String(p_photo || '').trim();
    }
    
    // Update ballot voter & candidate names for display accuracy
    db.ballots.forEach(b => {
      if (b.voter_id === p_id) b.voter_name = name;
      if (b.cid === p_id) b.cname = name;
    });

    DB.save(db);
    return emp;
  },

  delEmp(p_pin, p_id) {
    const db = DB.get();
    if (String(p_pin || '').trim() !== String(db.admin_pin)) throw new Error('Wrong admin PIN');
    db.employees = db.employees.filter(e => e.id !== p_id);
    db.ballots = db.ballots.filter(b => b.cid !== p_id && b.voter_id !== p_id);
    db.feedback = db.feedback.filter(f => f.eid !== p_id);
    DB.save(db);
    return true;
  },

  setRev(p_pin, p_on) {
    const db = DB.get();
    if (String(p_pin || '').trim() !== String(db.admin_pin)) throw new Error('Wrong admin PIN');
    db.rev = !!p_on;
    DB.save(db);
    return true;
  },

  resetDemo(p_pin) {
    const db = DB.get();
    if (String(p_pin || '').trim() !== String(db.admin_pin)) throw new Error('Wrong admin PIN');
    DB.reset();
    return true;
  }
};

const run = async (fn, ...args) => RPC[fn](...args);

// Application State
let D = { emps: [], counts: {} },
    curVoter = null,
    voterState = { hasVoted: false, votedFor: null, votedTime: null },
    pin = null,
    A = null,
    armed = null;

// Initial sync
syncRosterFromUrl();

// Set date string
$('mo').textContent = new Date().toLocaleString('en-US', { month: 'long', year: 'numeric' }) + ' · Company Voting & Verification';

// WhatsApp share button
function updateWhatsAppButton() {
  const url = getShareUrl();
  const text = encodeURIComponent(`🏆 Cast your vote for Employee of the Month!\nVerify and cast your vote here: ${url}`);
  $('wa-share').href = `https://api.whatsapp.com/send?text=${text}`;
  $('wa-share').onclick = (e) => {
    if (navigator.share) {
      e.preventDefault();
      navigator.share({
        title: 'Employee of the Month Voting',
        text: 'Vote for your colleague of the month! Verified & mobile-friendly.',
        url: url
      }).catch(() => {
        window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
      });
    }
  };
}
updateWhatsAppButton();

const ini = n => n.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const av = e => e.photo
  ? `<img class="av" src="${esc(e.photo)}" alt="${esc(e.name)}" title="Tap to zoom">`
  : `<div class="av">${esc(ini(e.name))}</div>`;

// Restore session from localStorage if saved
try {
  const savedVoterId = localStorage.getItem('eom_voter_id');
  if (savedVoterId) {
    const db = DB.get();
    const emp = db.employees.find(e => e.id === savedVoterId);
    if (emp) curVoter = emp;
  }
} catch(e) {}

async function load() {
  try {
    D = await run('pub');
  } catch(e) { err(e); }

  if (curVoter) {
    try {
      const res = await run('empLogin', curVoter.id, curVoter.pin || '1111');
      curVoter = res.emp;
      voterState = res;
    } catch(e) {
      curVoter = null;
      localStorage.removeItem('eom_voter_id');
    }
  }

  if (pin) {
    try {
      A = await run('adm', pin);
    } catch(e) {
      pin = null;
      A = null;
      err(e);
    }
  }

  updateWhatsAppButton();
  render();
}

function render() {
  const adminOn = !!(pin && A);
  const c = adminOn ? A.counts : D.counts;
  const show = adminOn || D.rev;
  const total = adminOn ? A.total : D.total;

  $('st').textContent = total + ' vote' + (total === 1 ? '' : 's') + ' cast' + (D.rev ? ' · Results announced 🎉' : ' · Voting active');

  // Render Employee Login / Session Bar
  renderVoterBar();

  // Admin panel rendering
  renderAdminPanel(adminOn);

  // Winner banner
  const mx = Math.max(0, ...D.emps.map(e => c[e.id] || 0));
  const win = D.rev && mx > 0 ? D.emps.filter(e => (c[e.id] || 0) === mx) : [];

  $('win').innerHTML = win.length ? `
    <div class="banner">
      <div>🏆 CONGRATULATIONS 🏆</div>
      <h2>${win.map(w => esc(w.name)).join(' & ')}</h2>
      <div class="sub-banner">${mx} vote${mx > 1 ? 's' : ''}${win.length > 1 ? ' each (Tie!)' : ''} · Winner of Employee of the Month!</div>
    </div>
  ` : '';

  // Employee voting cards
  let h = '';
  if (!D.emps.length) {
    h = `<div class="panel" style="text-align:center;padding:32px"><p class="note">No employees added yet. Tap Admin Login below to add team members.</p></div>`;
  } else {
    const list = D.rev ? [...D.emps].sort((a, b) => (c[b.id] || 0) - (c[a.id] || 0)) : D.emps;
    h = '<div class="grid">' + list.map(e => {
      const isMe = curVoter && curVoter.id === e.id;
      const isWinner = win.some(w => w.id === e.id);
      return `
        <div class="card${isWinner ? ' win' : ''}${isMe ? ' is-me' : ''}">
          ${isWinner ? '<span class="crown">🏆 WINNER</span>' : ''}
          ${isMe ? '<span class="badge-me">YOU</span>' : ''}
          ${av(e)}
          <div class="nm">${esc(e.name)}</div>
          <div class="rl">${esc(e.role || 'Team Member')}</div>
          ${show ? `<div class="cnt">${c[e.id] || 0} <span style="font-size:0.8rem;color:var(--mute);font-weight:600">votes</span></div>` : ''}
          <div class="card-actions">
            ${curVoter && !voterState.hasVoted && !D.rev ? `
              ${isMe ? `
                <button class="g" disabled style="opacity:0.6;font-size:0.8rem">✕ Cannot vote for yourself</button>
              ` : `
                <button data-v="${e.id}" class="${armed === e.id ? 'btn-confirm' : ''}">
                  ${armed === e.id ? 'Tap again to confirm' : 'Vote for ' + esc(e.name.split(' ')[0])}
                </button>
              `}
            ` : ''}
            
            ${!curVoter && !D.rev ? `
              <button class="g" data-need-login="${e.id}" style="font-size:0.8rem">Login to Vote</button>
            ` : ''}

            <button class="g" data-f="${e.id}">✍️ Compliment / Feedback</button>

            ${adminOn ? `
              <div class="row" style="margin-top:4px">
                <button class="g sm" data-edit="${e.id}" style="flex:1">✏️ Edit</button>
                <button class="g danger sm" data-d="${e.id}">${armed === 'd' + e.id ? 'Sure?' : '✕ Remove'}</button>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }).join('') + '</div>';

    if (curVoter && voterState.hasVoted && !D.rev) {
      h += `
        <div class="panel" style="text-align:center;margin-top:16px;background:var(--ok-bg);border-color:var(--ok)">
          <p style="margin:0;font-weight:700;color:var(--ok)">
            ✓ Thank you, ${esc(curVoter.name)}! You voted for <b>${esc(voterState.votedFor)}</b> on ${esc(voterState.votedTime)}.
          </p>
        </div>
      `;
    }
  }

  $('app').innerHTML = h;

  // Event handlers
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => doVote(b.dataset.v));
  document.querySelectorAll('[data-need-login]').forEach(b => b.onclick = () => {
    toast('Please select your name above to login and vote');
    const sel = $('voter-select');
    if (sel) { sel.focus(); sel.scrollIntoView({ behavior: 'smooth' }); }
  });
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => openFb(b.dataset.f));
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEditEmp(b.dataset.edit));
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => doDel(b.dataset.d));
  document.querySelectorAll('img.av').forEach(i => i.onclick = () => openZoom(i.src, i.alt));
}

      const msg = `📢 Employee of the Month Voting Reminder!\nPending voters: ${pendingNames}\nPlease cast your vote here: ${window.location.href.split('#')[0]}`;
      navigator.clipboard.writeText(msg).then(() => {
        toast('Copied WhatsApp reminder message to clipboard!');
      }).catch(() => {
        prompt('Copy reminder message:', msg);
      });
    };
  }

  admEl.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEditEmp(b.dataset.edit));
  admEl.querySelectorAll('[data-d]').forEach(b => b.onclick = () => doDel(b.dataset.d));
}

function fbHtml() {
  if (!A.fb.length) return '<div class="note">No feedback submitted yet this month.</div>';
  return D.emps.map(e => {
    const list = A.fb.filter(f => f.eid === e.id);
    return list.length ? `
      <div style="margin-top:12px;padding:10px 14px;background:var(--card);border-radius:12px;border:1px solid var(--line)">
        <b>${esc(e.name)}</b>
        ${list.map(f => `
          <div class="fi ${f.kind[0]}">
            ${f.kind === 'compliment' ? '👏 Compliment' : '💡 Suggestion'}: ${esc(f.text)}
            <div class="note" style="margin-top:2px">From ${esc(f.voter_name || 'Staff')} · ${esc(f.timestamp || '')}</div>
          </div>
        `).join('')}
      </div>
    ` : '';
  }).join('');
}

function arm(k) {
  armed = k;
  render();
  setTimeout(() => {
    if (armed === k) {
      armed = null;
      render();
    }
  }, 3000);
}

// Voting execution
async function doVote(candidateId) {
  if (!curVoter) {
    return toast('Please select your name above to login and vote');
  }
  if (armed !== candidateId) return arm(candidateId);
  armed = null;

  try {
    const res = await run('empVote', curVoter.id, candidateId);
    voterState.hasVoted = true;
    voterState.votedFor = res.candidateName;
    voterState.votedTime = res.timeStr;
    toast(`🎉 Vote recorded for ${res.candidateName}! Thank you!`);
    await load();
  } catch(e) {
    err(e);
    await load();
  }
}

// Delete Employee
async function doDel(id) {
  if (armed !== 'd' + id) return arm('d' + id);
  armed = null;
  try {
    await run('delEmp', pin, id);
    toast('Employee removed permanently');
    await load();
  } catch(e) { err(e); }
}

// Add New Employee
async function addEmp() {
  const n = $('en').value.trim();
  if (!n) return toast('Please enter an employee name.');
  let p = '';
  try {
    const f = $('ep').files[0];
    if (f) p = await compressImage(f);
  } catch(e) {
    return toast('Could not read that photo file.');
  }
  try {
    await run('addEmp', pin, n, $('er').value.trim(), p);
    $('en').value = '';
    $('er').value = '';
    $('ep').value = '';
    toast('✓ Employee added and permanently saved!');
    await load();
  } catch(e) { err(e); }
}

// Edit Existing Employee Modal (Change Name, Role, Upload / Replace Photo)
function openEditEmp(empId) {
  const emp = D.emps.find(e => e.id === empId);
  if (!emp) return;

  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `
    <div class="box">
      <h3 style="margin:0 0 12px">✏️ Edit Employee & Photo</h3>
      
      <div style="text-align:center;margin-bottom:14px">
        ${emp.photo ? `
          <img id="edit-preview" src="${esc(emp.photo)}" style="width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--line);box-shadow:var(--shadow)">
        ` : `
          <div id="edit-preview" class="av">${esc(ini(emp.name))}</div>
        `}
      </div>

      <div style="margin-bottom:10px">
        <label class="note" style="display:block;margin-bottom:4px">Full Name</label>
        <input id="edit-name" value="${esc(emp.name)}" style="width:100%">
      </div>

      <div style="margin-bottom:10px">
        <label class="note" style="display:block;margin-bottom:4px">Role / Department</label>
        <input id="edit-role" value="${esc(emp.role || '')}" style="width:100%">
      </div>

      <div style="margin-bottom:10px;background:var(--bg);padding:10px;border-radius:10px;border:1px solid var(--line)">
        <label class="note" style="display:block;margin-bottom:4px"><b>Upload / Replace Photo:</b></label>
        <input id="edit-file" type="file" accept="image/*" style="font-size:12px;width:100%;padding:4px">
        
        <div style="margin-top:8px">
          <label class="note" style="display:block;margin-bottom:2px">Or paste an Image URL:</label>
          <input id="edit-url" placeholder="https://..." value="${emp.photo && emp.photo.startsWith('http') ? esc(emp.photo) : ''}" style="width:100%;font-size:13px">
        </div>

        ${emp.photo ? `
          <div style="margin-top:8px">
            <button class="g danger sm" id="edit-remove-photo" style="width:100%">Remove Current Photo</button>
          </div>
        ` : ''}
      </div>

      <div class="row" style="margin-top:16px;justify-content:flex-end">
        <button class="g" id="edit-cancel">Cancel</button>
        <button id="edit-save">Save Changes Permanently</button>
      </div>
    </div>
  `;
  document.body.appendChild(m);

  let newPhotoBase64 = emp.photo;

  // File input preview & compression
  m.querySelector('#edit-file').onchange = async (ev) => {
    const file = ev.target.files[0];
    if (file) {
      try {
        newPhotoBase64 = await compressImage(file);
        const prev = m.querySelector('#edit-preview');
        if (prev.tagName === 'IMG') {
          prev.src = newPhotoBase64;
        } else {
          prev.outerHTML = `<img id="edit-preview" src="${newPhotoBase64}" style="width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--line);box-shadow:var(--shadow)">`;
        }
        toast('New photo ready to save');
      } catch(e) { toast('Could not read image file'); }
    }
  };

  const removePhotoBtn = m.querySelector('#edit-remove-photo');
  if (removePhotoBtn) {
    removePhotoBtn.onclick = () => {
      newPhotoBase64 = '';
      m.querySelector('#edit-url').value = '';
      const prev = m.querySelector('#edit-preview');
      prev.outerHTML = `<div id="edit-preview" class="av">${esc(ini(m.querySelector('#edit-name').value || 'EM'))}</div>`;
      toast('Photo removed. Initials will be used.');
    };
  }

  m.querySelector('#edit-cancel').onclick = () => m.remove();

  m.querySelector('#edit-save').onclick = async () => {
    const newName = m.querySelector('#edit-name').value.trim();
    const newRole = m.querySelector('#edit-role').value.trim();
    const urlInput = m.querySelector('#edit-url').value.trim();
    if (!newName) return toast('Employee name is required');

    let finalPhoto = newPhotoBase64;
    if (urlInput) {
      finalPhoto = urlInput;
    }

    try {
      await run('editEmp', pin, emp.id, newName, newRole, finalPhoto);
      m.remove();
      toast('✓ Employee updated and saved permanently!');
      await load();
    } catch(e) { err(e); }
  };
}

// Anonymous Feedback Modal
function openFb(eid) {
  const e = D.emps.find(x => x.id === eid);
  if (!e) return;
  let kind = 'compliment';
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `
    <div class="box">
      <h3 style="margin:0 0 4px">Feedback for ${esc(e.name)}</h3>
      <div class="note">🔒 Anonymous: Admin sees feedback to foster team recognition.</div>
      <div class="seg">
        <button data-k="compliment" class="on">👏 Compliment</button>
        <button data-k="suggestion">💡 Suggestion</button>
      </div>
      <textarea maxlength="600" placeholder="Write a compliment or constructive suggestion…"></textarea>
      <div class="row" style="margin-top:12px;justify-content:flex-end">
        <button class="g" data-c>Cancel</button>
        <button data-s>Send Feedback</button>
      </div>
    </div>
  `;
  document.body.appendChild(m);
  m.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    kind = b.dataset.k;
    m.querySelectorAll('[data-k]').forEach(x => x.classList.toggle('on', x === b));
  });
  m.querySelector('[data-c]').onclick = () => m.remove();
  m.querySelector('[data-s]').onclick = async () => {
    const t = m.querySelector('textarea').value.trim();
    if (!t) return toast('Please write something first.');
    try {
      await run('fb', curVoter ? curVoter.id : null, eid, kind, t);
      m.remove();
      toast('Thank you! Sent to admin.');
    } catch(x) { err(x); }
  };
}

// Touch & Pinch Photo Zoom
function openZoom(src, name) {
  let z = 1, x = 0, y = 0, d0 = 1, z0 = 1;
  const pts = new Map();
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `
    <div style="color:#fff;font-weight:800;font-size:1.1rem;text-shadow:0 2px 4px rgba(0,0,0,0.5)">${esc(name)}</div>
    <div class="zw"><img class="zi" src="${esc(src)}" alt=""></div>
    <div class="row" style="margin-top:4px">
      <button data-o>− Zoom Out</button>
      <button data-i>+ Zoom In</button>
      <button class="g" data-r style="color:#fff;border-color:rgba(255,255,255,0.4)">Reset</button>
      <button class="g" data-x style="color:#fff;border-color:rgba(255,255,255,0.4)">Close</button>
    </div>
    <div style="color:#cbd5e1;font-size:0.8rem">Pinch, double-tap, or scroll to zoom · Drag to pan</div>
  `;
  document.body.appendChild(m);

  const img = m.querySelector('.zi');
  const ap = () => { img.style.transform = `translate(${x}px,${y}px) scale(${z})`; };
  const sz = v => {
    z = Math.min(5, Math.max(1, v));
    if (z === 1) { x = 0; y = 0; }
    ap();
  };

  m.querySelector('[data-i]').onclick = () => sz(z + 0.5);
  m.querySelector('[data-o]').onclick = () => sz(z - 0.5);
  m.querySelector('[data-r]').onclick = () => sz(1);
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.onclick = ev => { if (ev.target === m) m.remove(); };

  m.querySelector('.zw').onwheel = ev => {
    ev.preventDefault();
    sz(z + (ev.deltaY < 0 ? 0.3 : -0.3));
  };
  img.ondblclick = () => sz(z > 1 ? 1 : 2.5);

  img.onpointerdown = ev => {
    img.setPointerCapture(ev.pointerId);
    pts.set(ev.pointerId, [ev.clientX, ev.clientY]);
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      d0 = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1;
      z0 = z;
    }
  };
  img.onpointermove = ev => {
    const p = pts.get(ev.pointerId);
    if (!p) return;
    pts.set(ev.pointerId, [ev.clientX, ev.clientY]);
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      sz(z0 * Math.hypot(a[0] - b[0], a[1] - b[1]) / d0);
    } else if (z > 1) {
      x += ev.clientX - p[0];
      y += ev.clientY - p[1];
      ap();
    }
  };
  img.onpointerup = img.onpointercancel = ev => pts.delete(ev.pointerId);
}

// Admin PIN Login
$('alink').onclick = e => {
  e.preventDefault();
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `
    <div class="box">
      <h3 style="margin:0 0 6px">Admin Login</h3>
      <div class="note" style="margin-bottom:12px">Default PIN is <b>1234</b></div>
      <div class="row">
        <input id="ap" type="password" placeholder="Enter Admin PIN" autofocus>
        <button data-s>Sign In</button>
        <button class="g" data-c>Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(m);
  m.querySelector('[data-c]').onclick = () => m.remove();
  m.querySelector('[data-s]').onclick = async () => {
    pin = m.querySelector('#ap').value;
    try {
      A = await run('adm', pin);
      m.remove();
      toast('Admin session opened');
      render();
    } catch(x) {
      pin = null;
      err(x);
    }
  };
};
