<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏆 Employee of the Month</title>
<!-- Open Graph tags for WhatsApp preview -->
<meta property="og:title" content="🏆 Employee of the Month — Anonymous Voting">
<meta property="og:description" content="Vote for your colleague of the month! Anonymous, fast, and mobile-friendly.">
<meta property="og:type" content="website">
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --ink: #0f172a;
  --mute: #64748b;
  --line: #e2e8f0;
  --acc: #ea580c;
  --acc-hover: #c2410c;
  --acc2: #ffedd5;
  --ok: #16a34a;
  --wa: #25d366;
  --wa-hover: #128c7e;
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --ink: #f8fafc;
    --mute: #94a3b8;
    --line: #334155;
    --acc: #f97316;
    --acc-hover: #fb923c;
    --acc2: #431407;
    --ok: #22c55e;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.5;
  padding-bottom: 60px;
}
main {
  max-width: 960px;
  margin: 0 auto;
  padding: 16px 14px 40px;
}
h1 {
  margin: 0;
  font-size: 1.45rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.sub {
  color: var(--mute);
  font-size: 0.85rem;
  margin-top: 2px;
}
.header-bar {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 16px;
  background: var(--card);
  padding: 14px 16px;
  border-radius: 18px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
@media (min-width: 640px) {
  .header-bar {
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
  }
}
.header-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.pill {
  background: var(--acc2);
  color: var(--acc);
  border-radius: 9999px;
  padding: 5px 12px;
  font-size: 0.82rem;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-wa {
  background: #25d366;
  color: #fff;
  border: 0;
  border-radius: 9999px;
  padding: 6px 14px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  box-shadow: 0 2px 5px rgba(37, 211, 102, 0.3);
  transition: transform 0.15s ease, background 0.15s ease;
}
.btn-wa:hover {
  background: #1eb956;
  transform: translateY(-1px);
}
.btn-wa svg {
  width: 17px;
  height: 17px;
  fill: currentColor;
}
.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.panel h3 {
  margin: 0 0 10px;
  font-size: 1.05rem;
  font-weight: 700;
}
.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
input, textarea, select {
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  color: var(--ink);
  font: inherit;
  font-size: 15px;
  flex: 1;
  min-width: 140px;
  outline: none;
  transition: border-color 0.2s;
}
input:focus, textarea:focus {
  border-color: var(--acc);
}
textarea {
  width: 100%;
  min-height: 100px;
  resize: vertical;
}
button {
  cursor: pointer;
  border: 0;
  border-radius: 10px;
  padding: 10px 16px;
  min-height: 42px;
  font-weight: 700;
  font-size: 0.9rem;
  background: var(--acc);
  color: #fff;
  transition: opacity 0.15s, transform 0.1s, background 0.15s;
}
button:hover:not(:disabled) {
  background: var(--acc-hover);
}
button:active:not(:disabled) {
  transform: scale(0.98);
}
button.g {
  background: transparent;
  color: var(--mute);
  border: 1px solid var(--line);
}
button.g:hover:not(:disabled) {
  background: var(--bg);
  color: var(--ink);
}
button.danger {
  background: #ef4444;
  color: #fff;
}
button.danger:hover:not(:disabled) {
  background: #dc2626;
}
button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Grid Layout for Mobile & Desktop */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media (min-width: 640px) {
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
    gap: 16px;
  }
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 16px 10px 14px;
  text-align: center;
  position: relative;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: transform 0.2s, box-shadow 0.2s;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}
.card.win {
  border: 2px solid var(--acc);
  background: linear-gradient(180deg, var(--acc2) 0%, var(--card) 60px);
  box-shadow: 0 8px 25px rgba(234, 88, 12, 0.2);
}
.av {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  object-fit: cover;
  margin: 0 auto 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--acc2);
  color: var(--acc);
  font-size: 1.8rem;
  font-weight: 800;
  border: 3px solid var(--line);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
}
img.av {
  cursor: zoom-in;
}
.nm {
  font-weight: 800;
  font-size: 1.05rem;
  margin-top: 4px;
  line-height: 1.25;
}
.rl {
  color: var(--mute);
  font-size: 0.8rem;
  margin-top: 3px;
  margin-bottom: 8px;
  min-height: 2.4em;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cnt {
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--acc);
  margin-bottom: 6px;
}
.crown {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--acc);
  color: #fff;
  border-radius: 9999px;
  padding: 3px 12px;
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
  white-space: nowrap;
}
.card-actions {
  width: 100%;
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.card button {
  width: 100%;
  padding: 8px;
  font-size: 0.85rem;
}
.card .g {
  font-size: 0.78rem;
  padding: 6px 4px;
}
.btn-confirm {
  background: #ea580c !important;
  animation: pulse 1s infinite alternate;
}
@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.03); }
}

/* Winner Banner */
.banner {
  text-align: center;
  padding: 24px 14px;
  border-radius: 20px;
  background: linear-gradient(135deg, #ea580c 0%, #f97316 50%, #fb923c 100%);
  color: #fff;
  margin-bottom: 16px;
  box-shadow: 0 8px 25px rgba(234, 88, 12, 0.35);
  position: relative;
  overflow: hidden;
}
.banner h2 {
  margin: 6px 0 4px;
  font-size: 1.8rem;
  font-weight: 900;
}
.banner .sub-banner {
  font-size: 1rem;
  opacity: 0.95;
  font-weight: 600;
}

/* Modals */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(4px);
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 100;
}
.box {
  background: var(--card);
  border-radius: 20px;
  padding: 20px;
  max-width: 440px;
  width: 100%;
  border: 1px solid var(--line);
  box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.25);
  animation: modalIn 0.2s ease-out;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(12px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.seg {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}
.seg button {
  flex: 1;
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
}
.seg .on {
  background: var(--acc);
  color: #fff;
  border-color: var(--acc);
}
.fi {
  border-left: 4px solid var(--acc);
  padding: 8px 12px;
  margin: 8px 0;
  background: var(--bg);
  border-radius: 8px;
  font-size: 0.88rem;
}
.fi.c { border-color: var(--ok); }

/* Zoom view */
.zw {
  width: min(92vw, 520px);
  height: min(65vh, 520px);
  overflow: hidden;
  border-radius: 18px;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  border: 1px solid rgba(255, 255, 255, 0.15);
}
.zi {
  max-width: 100%;
  max-height: 100%;
  touch-action: none;
  user-select: none;
  transition: transform 0.05s ease-out;
}

/* Toast */
#toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) translateY(20px);
  background: #0f172a;
  color: #f8fafc;
  padding: 10px 18px;
  border-radius: 9999px;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  max-width: 90vw;
  text-align: center;
  font-size: 0.88rem;
  font-weight: 600;
  box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4);
}
#toast.s {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.sample-codes {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.code-chip {
  background: var(--bg);
  border: 1px dashed var(--line);
  padding: 4px 8px;
  border-radius: 6px;
  font-family: monospace;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--acc);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.code-chip:hover {
  background: var(--acc2);
  border-color: var(--acc);
}

.note {
  color: var(--mute);
  font-size: 0.82rem;
  margin: 8px 0 0;
}
.footer {
  margin-top: 32px;
  text-align: center;
  border-top: 1px solid var(--line);
  padding-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}
</style>
</head>
<body>
<main>
  <!-- Header Bar -->
  <div class="header-bar">
    <div>
      <h1>🏆 Employee of the Month</h1>
      <div class="sub" id="mo"></div>
    </div>
    <div class="header-actions">
      <span class="pill" id="st">Loading…</span>
      <a href="#" class="btn-wa" id="wa-share" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M12.031 2C6.495 2 2 6.495 2 12.031c0 1.97.57 3.81 1.558 5.37L2 22l4.757-1.528A9.97 9.97 0 0 0 12.031 22c5.536 0 10.031-4.495 10.031-10.031C22.062 6.495 17.567 2 12.031 2zm5.836 14.198c-.244.686-1.42 1.258-1.954 1.341-.534.084-1.226.118-3.957-.962-3.486-1.38-5.74-4.89-5.914-5.124-.174-.233-1.412-1.879-1.412-3.585 0-1.706.892-2.545 1.21-2.894.318-.35.693-.437.925-.437.233 0 .465.002.668.012.215.01.503-.082.787.6.294.706 1.002 2.44 1.089 2.617.087.177.145.385.029.618-.116.233-.174.378-.348.583-.174.204-.367.456-.525.612-.174.174-.356.363-.153.712.204.35 1.049 1.728 2.25 2.798 1.545 1.378 2.848 1.805 3.254 2.008.407.204.646.175.885-.102.24-.277 1.026-1.196 1.3-1.608.274-.412.547-.344.92-.204.374.14 2.373 1.119 2.78 1.323.407.204.678.305.779.476.102.171.102.991-.142 1.677z"/></svg>
        Share on WhatsApp
      </a>
    </div>
  </div>

  <!-- Admin Panel Mount Point -->
  <div id="adm"></div>

  <!-- Winner Banner Mount Point -->
  <div id="win"></div>

  <!-- Main Content App -->
  <div id="app">
    <div style="text-align:center;padding:32px;color:var(--mute)">Loading voting system…</div>
  </div>

  <div class="footer">
    <p class="note">🔒 100% Anonymous: Voting codes are never stored with votes. Compliments and suggestions are readable only by admin.</p>
    <div>
      <a href="#" id="alink" style="color:var(--mute);font-weight:600;font-size:0.85rem">⚙️ Admin Login (PIN: 1234)</a>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
/* -------------------------------------------------------------
   Interactive Client-side Engine (No Supabase required)
   Persists to localStorage so it works everywhere out of the box!
------------------------------------------------------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ls = (k, v) => {
  try {
    if (v === undefined) return localStorage.getItem(k) || '';
    localStorage.setItem(k, v);
  } catch(e) { return ''; }
};

function toast(t) {
  const e = $('toast');
  e.textContent = t;
  e.className = 's';
  clearTimeout(e._t);
  e._t = setTimeout(() => e.className = '', 3500);
}
const err = e => toast((e && e.message || String(e)).replace(/^Error:\s*/, ''));

// Get current month string: '2026-10'
const getMonthStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
};

// Default Sample Data
const DEFAULT_DATA = {
  admin_pin: '1234',
  rev: false,
  employees: [
    {
      id: 'e1',
      name: 'Sarah Chen',
      role: 'Lead UI/UX Designer',
      photo: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=400&auto=format&fit=crop&q=80',
      created_at: 1000
    },
    {
      id: 'e2',
      name: 'Marcus Johnson',
      role: 'Senior Backend Engineer',
      photo: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80',
      created_at: 2000
    },
    {
      id: 'e3',
      name: 'Priya Sharma',
      role: 'Customer Success Lead',
      photo: 'https://images.unsplash.com/photo-1580489944761-15a19d654956?w=400&auto=format&fit=crop&q=80',
      created_at: 3000
    },
    {
      id: 'e4',
      name: 'Alex Rivera',
      role: 'DevOps & Cloud Architect',
      photo: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&auto=format&fit=crop&q=80',
      created_at: 4000
    }
  ],
  codes: [
    { code: 'VOTE01', used_month: '' },
    { code: 'VOTE02', used_month: '' },
    { code: 'VOTE03', used_month: '' },
    { code: 'VOTE04', used_month: '' },
    { code: 'VOTE05', used_month: '' },
    { code: 'VOTE06', used_month: '' }
  ],
  ballots: [],
  feedback: [
    { month: getMonthStr(), eid: 'e1', kind: 'compliment', text: 'Sarah redesigned our entire mobile onboarding flow. Super helpful!' },
    { month: getMonthStr(), eid: 'e3', kind: 'compliment', text: 'Priya always stays calm under pressure and helps everyone solve client issues.' },
    { month: getMonthStr(), eid: 'e4', kind: 'suggestion', text: 'Alex could help host a quick internal workshop on Docker best practices!' }
  ]
};

// Database Engine
const DB = {
  get() {
    try {
      const raw = localStorage.getItem('eom_db_v1');
      if (!raw) {
        localStorage.setItem('eom_db_v1', JSON.stringify(DEFAULT_DATA));
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
      return JSON.parse(raw);
    } catch(e) {
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }
  },
  save(data) {
    try {
      localStorage.setItem('eom_db_v1', JSON.stringify(data));
    } catch(e) {
      console.error('Storage error:', e);
    }
  },
  reset() {
    localStorage.removeItem('eom_db_v1');
    return this.get();
  }
};

// Serverless-style RPC calls over local database
const RPC = {
  pub() {
    const db = DB.get();
    const curMonth = getMonthStr();
    const monthBallots = db.ballots.filter(b => b.month === curMonth);
    const counts = {};
    monthBallots.forEach(b => { counts[b.cid] = (counts[b.cid] || 0) + 1; });
    return {
      m: curMonth,
      rev: !!db.rev,
      total: monthBallots.length,
      counts: db.rev ? counts : {},
      emps: db.employees
    };
  },
  chk(p_code) {
    const db = DB.get();
    const code = String(p_code || '').trim().toUpperCase();
    const r = db.codes.find(c => c.code === code);
    if (!r) throw new Error('Invalid code. Please check with your admin.');
    return { used: r.used_month === getMonthStr() };
  },
  vote(p_code, p_cid) {
    const db = DB.get();
    const code = String(p_code || '').trim().toUpperCase();
    const curMonth = getMonthStr();
    const r = db.codes.find(c => c.code === code);
    if (!r) throw new Error('Invalid code');
    if (r.used_month === curMonth) throw new Error('This code has already voted this month');
    if (!db.employees.some(e => e.id === p_cid)) throw new Error('Employee not found');
    
    // Store ballot anonymously (only month and cid, no voter or code)
    db.ballots.push({ month: curMonth, cid: p_cid });
    r.used_month = curMonth;
    DB.save(db);
    return true;
  },
  fb(p_code, p_eid, p_kind, p_text) {
    this.chk(p_code);
    const text = String(p_text || '').trim();
    if (!text) throw new Error('Please write something');
    const db = DB.get();
    db.feedback.push({
      month: getMonthStr(),
      eid: p_eid,
      kind: p_kind === 'suggestion' ? 'suggestion' : 'compliment',
      text: text.slice(0, 600)
    });
    DB.save(db);
    return true;
  },
  adm(p_pin) {
    const db = DB.get();
    if (String(p_pin || '').trim() !== String(db.admin_pin)) {
      throw new Error('Wrong admin PIN. Default is 1234');
    }
    const curMonth = getMonthStr();
    const monthBallots = db.ballots.filter(b => b.month === curMonth);
    const counts = {};
    monthBallots.forEach(b => { counts[b.cid] = (counts[b.cid] || 0) + 1; });
    const usedCodes = db.codes.filter(c => c.used_month === curMonth).length;
    const fbList = db.feedback.filter(f => f.month === curMonth);
    return {
      counts,
      total: monthBallots.length,
      codes: db.codes.length,
      used: usedCodes,
      allCodes: db.codes.map(c => c.code),
      fb: fbList
    };
  },
  addEmp(p_pin, p_name, p_role, p_photo) {
    const db = DB.get();
    if (String(p_pin || '').trim() !== String(db.admin_pin)) throw new Error('Wrong admin PIN');
    const name = String(p_name || '').trim();
    if (!name) throw new Error('Name required');
    const newEmp = {
      id: 'e' + Date.now(),
      name,
      role: String(p_role || '').trim(),
      photo: String(p_photo || '').trim().slice(0, 250000),
      created_at: Date.now()
    };
    db.employees.push(newEmp);
    DB.save(db);
    return true;
  },
  delEmp(p_pin, p_id) {
    const db = DB.get();
    if (String(p_pin || '').trim() !== String(db.admin_pin)) throw new Error('Wrong admin PIN');
    db.employees = db.employees.filter(e => e.id !== p_id);
    db.ballots = db.ballots.filter(b => b.cid !== p_id);
    db.feedback = db.feedback.filter(f => f.eid !== p_id);
    DB.save(db);
    return true;
  },
  setRev(p_pin, p_on) {
    const db = DB.get();
    if (String(p_pin || '').trim() !== String(db.admin_pin)) throw new Error('Wrong admin PIN');
    db.rev = !!p_on;
    DB.save(db);
    return true;
  },
  mkCodes(p_pin, p_n) {
    const db = DB.get();
    if (String(p_pin || '').trim() !== String(db.admin_pin)) throw new Error('Wrong admin PIN');
    const count = Math.min(Math.max(parseInt(p_n, 10) || 1, 1), 100);
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const generated = [];
    const existing = new Set(db.codes.map(c => c.code));
    while (generated.length < count) {
      let code = '';
      for (let i = 0; i < 6; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
      }
      if (!existing.has(code)) {
        existing.add(code);
        generated.push(code);
        db.codes.push({ code, used_month: '' });
      }
    }
    DB.save(db);
    return generated;
  },
  resetDemo(p_pin) {
    const db = DB.get();
    if (String(p_pin || '').trim() !== String(db.admin_pin)) throw new Error('Wrong admin PIN');
    DB.reset();
    return true;
  }
};

const run = async (fn, ...args) => RPC[fn](...args);

// State Variables
let D = { emps: [], counts: {} },
    code = ls('c'),
    used = false,
    pin = null,
    A = null,
    armed = null,
    newCodes = '';

$('mo').textContent = new Date().toLocaleString('en-US', { month: 'long', year: 'numeric' }) + ' · Cast your anonymous vote';

// Update WhatsApp share link
const shareText = encodeURIComponent(`🏆 Vote for Employee of the Month!\nCast your anonymous vote here: ${window.location.href}`);

$('wa-share').onclick = (e) => {

const ini = n => n.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();

async function load() {
  try {
    D = await run('pub');
  } catch(e) { err(e); }

  if (code) {
    try {
      used = (await run('chk', code)).used;
    } catch(e) {
      code = '';
      ls('c', '');
    }
  }

  if (pin) {
    try {
      A = await run('adm', pin);
    } catch(e) {
      pin = null;
      A = null;
      err(e);
    }
  }
  render();
}

function render() {
  const adminOn = !!(pin && A);
  const c = adminOn ? A.counts : D.counts;
  const show = adminOn || D.rev;
  const total = adminOn ? A.total : D.total;

  $('st').textContent = total + ' vote' + (total === 1 ? '' : 's') + ' cast' + (D.rev ? ' · Results announced 🎉' : ' · Voting active');

  // Admin panel rendering
  $('adm').innerHTML = adminOn ? `

      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <h3 style="margin:0">⚙️ Admin Dashboard</h3>
        <span class="pill">Logged in (PIN: ${esc(pin)})</span>
      </div>

      <div class="row" style="margin-bottom:8px">
        <input id="en" placeholder="Employee full name">
        <input id="er" placeholder="Role/Department (optional)">
        <input id="ep" type="file" accept="image/*" style="font-size:13px">
        <button id="add">Add Employee</button>
      </div>

      <div class="row" style="margin-top:12px">
        <input id="nc" type="number" min="1" max="100" value="5" style="max-width:90px">
        <button id="mk">Generate Voting Codes</button>
        <button class="g" id="view-codes">View All Codes</button>
        <span class="note" style="margin:0">${A.used} of ${A.codes} codes used this month</span>
      </div>

      ${newCodes ? `
        <div style="margin-top:10px">
          <textarea id="ct" readonly style="font-family:monospace">${esc(newCodes)}</textarea>
          <div class="note">📋 Copy and distribute one code to each staff member.</div>
        </div>
      ` : ''}

      <div class="row" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
        <button id="rv">${D.rev ? '🔒 Hide Results from Public' : '🎉 Reveal Winner to Everyone'}</button>
        <button class="g danger" id="reset-btn">Reset to Default Data</button>
        <button class="g" id="ex">Exit Admin</button>
      </div>
    </div>

    <div class="panel">
      <h3>💬 Anonymous Staff Feedback (${A.fb.length} submitted)</h3>
      ${fbHtml()}
    </div>
  ` : '';

  if (adminOn) {
    $('add').onclick = addEmp;
    $('ex').onclick = () => { pin = null; A = null; newCodes = ''; render(); };
    $('mk').onclick = async () => {
      try {
        const codes = await run('mkCodes', pin, $('nc').value);

        await load();

    };
    $('view-codes').onclick = () => {
      newCodes = A.allCodes.join('\n');
      render();
    };
    $('rv').onclick = async () => {
      try {
        await run('setRev', pin, !D.rev);
        toast(D.rev ? 'Results hidden' : 'Winner revealed to everyone!');
        await load();
      } catch(e) { err(e); }
    };
    $('reset-btn').onclick = async () => {
      if (confirm('Reset all employees, votes, and feedback to demo data?')) {
        await run('resetDemo', pin);

        await load();
      }
    };
  }

  // Calculate winner
  const mx = Math.max(0, ...D.emps.map(e => c[e.id] || 0));
  const win = D.rev && mx > 0 ? D.emps.filter(e => (c[e.id] || 0) === mx) : [];

  $('win').innerHTML = win.length ? `

  let h = '';

  // Voting Code Box
  if (!code && !adminOn) {

  } else if (code && !adminOn) {
    h += `
      <div class="panel" style="padding:10px 16px;background:var(--acc2);border-color:var(--acc)">

          <span style="font-size:0.9rem;font-weight:700;color:var(--acc)">
            🔑 Active Code: <code>${esc(code)}</code> ${used ? '(✓ Vote Cast)' : '(Ready to vote)'}
          </span>
          <button class="g" id="change-code" style="padding:4px 8px;min-height:30px;font-size:0.8rem">Change Code</button>
        </div>
      </div>
    `;
  }

  // Employee List
  if (!D.emps.length) {
    h += `<div class="panel" style="text-align:center;padding:32px"><p class="note">No employees added yet. Admin can add candidates in the admin panel.</p></div>`;
  } else {
    const list = D.rev ? [...D.emps].sort((a, b) => (c[b.id] || 0) - (c[a.id] || 0)) : D.emps;
    h += '<div class="grid">' + list.map(e => `
      <div class="card${win.some(w => w.id === e.id) ? ' win' : ''}">
        ${win.some(w => w.id === e.id) ? '<span class="crown">🏆 WINNER</span>' : ''}
        ${av(e)}
        <div class="nm">${esc(e.name)}</div>
        <div class="rl">${esc(e.role || 'Team Member')}</div>
        ${show ? `<div class="cnt">${c[e.id] || 0} <span style="font-size:0.8rem;color:var(--mute);font-weight:600">votes</span></div>` : ''}
        <div class="card-actions">
          ${code && !used && !D.rev ? `
            <button data-v="${e.id}" class="${armed === e.id ? 'btn-confirm' : ''}">
              ${armed === e.id ? 'Tap again to confirm' : 'Vote for ' + esc(e.name.split(' ')[0])}

          ${code ? `<button class="g" data-f="${e.id}">✍️ Compliment / Feedback</button>` : ''}
          ${adminOn ? `<button class="g danger" data-d="${e.id}">${armed === 'd' + e.id ? 'Confirm Remove?' : '✕ Remove'}</button>` : ''}

    if (code && used && !D.rev) {
      h += `<div class="panel" style="text-align:center;margin-top:16px"><p style="margin:0;font-weight:700;color:var(--ok)">✓ Thanks! Your vote was recorded anonymously. The winner will be revealed soon.</p></div>`;

  $('app').innerHTML = h;

  // Event handlers
  if ($('go')) {
    $('go').onclick = async () => {

      render();

  document.querySelectorAll('[data-chip]').forEach(chip => {
    chip.onclick = () => {
      if ($('cd')) $('cd').value = chip.dataset.chip;
      if ($('go')) $('go').click();
    };

  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => doVote(b.dataset.v));
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => openFb(b.dataset.f));
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => doDel(b.dataset.d));
  document.querySelectorAll('img.av').forEach(i => i.onclick = () => openZoom(i.src, i.alt));
}

function fbHtml() {
  if (!A.fb.length) return '<div class="note">No feedback submitted yet this month.</div>';

}

function arm(k) {
  armed = k;
  render();
  setTimeout(() => {
    if (armed === k) {
      armed = null;
      render();

}

async function doVote(id) {
  if (armed !== id) return arm(id);
  armed = null;
  try {
    await run('vote', code, id);
    used = true;
    toast('🎉 Vote recorded anonymously. Thank you!');
    await load();
  } catch(e) {
    err(e);
    await load();
  }
}

async function doDel(id) {
  if (armed !== 'd' + id) return arm('d' + id);
  armed = null;
  try {
    await run('delEmp', pin, id);
    toast('Employee removed');
    await load();
  } catch(e) { err(e); }
}

function shrink(f) {
  return new Promise((ok, no) => {
    const r = new FileReader();
    r.onerror = no;
    r.onload = () => {
      const i = new Image();
      i.onerror = no;
      i.onload = () => {
        let s = Math.min(420, i.width, i.height), q = 0.82, u;
        const cv = document.createElement('canvas');
        for (let t = 0; t < 8; t++) {
          cv.width = cv.height = s;
          const k = Math.min(i.width, i.height);
          cv.getContext('2d').drawImage(i, (i.width - k) / 2, (i.height - k) / 2, k, k, 0, 0, s, s);
          u = cv.toDataURL('image/jpeg', q);
          if (u.length < 50000) break;
          q -= 0.1;
          s = Math.round(s * 0.85);
        }
        ok(u);
      };
      i.src = r.result;
    };
    r.readAsDataURL(f);
  });
}

async function addEmp() {
  const n = $('en').value.trim();
  if (!n) return toast('Please enter an employee name.');
  let p = '';
  try {
    const f = $('ep').files[0];
    if (f) p = await shrink(f);
  } catch(e) {
    return toast('Could not read that photo.');

  try {
    await run('addEmp', pin, n, $('er').value.trim(), p);
    $('en').value = '';
    $('er').value = '';
    $('ep').value = '';

}

  document.body.appendChild(m);

      m.remove();
      toast('Thank you! Sent anonymously to admin.');
    } catch(x) { err(x); }
  };
}

function openZoom(src, name) {
  let z = 1, x = 0, y = 0, d0 = 1, z0 = 1;
  const pts = new Map();
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `
    <div style="color:#fff;font-weight:800;font-size:1.1rem;text-shadow:0 2px 4px rgba(0,0,0,0.5)">${esc(name)}</div>
    <div class="zw"><img class="zi" src="${esc(src)}" alt=""></div>
    <div class="row" style="margin-top:4px">
      <button data-o>− Zoom Out</button>
      <button data-i>+ Zoom In</button>
      <button class="g" data-r style="color:#fff;border-color:rgba(255,255,255,0.4)">Reset</button>
      <button class="g" data-x style="color:#fff;border-color:rgba(255,255,255,0.4)">Close</button>
    </div>
    <div style="color:#cbd5e1;font-size:0.8rem">Pinch, double-tap, or scroll to zoom · Drag to pan</div>
  `;
  document.body.appendChild(m);

  const img = m.querySelector('.zi');
  const ap = () => { img.style.transform = `translate(${x}px,${y}px) scale(${z})`; };
  const sz = v => {
    z = Math.min(5, Math.max(1, v));
    if (z === 1) { x = 0; y = 0; }
    ap();
  };

  m.querySelector('[data-i]').onclick = () => sz(z + 0.5);
  m.querySelector('[data-o]').onclick = () => sz(z - 0.5);
  m.querySelector('[data-r]').onclick = () => sz(1);
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.onclick = ev => { if (ev.target === m) m.remove(); };

  m.querySelector('.zw').onwheel = ev => {
    ev.preventDefault();
    sz(z + (ev.deltaY < 0 ? 0.3 : -0.3));
  };
  img.ondblclick = () => sz(z > 1 ? 1 : 2.5);

  img.onpointerdown = ev => {
    img.setPointerCapture(ev.pointerId);
    pts.set(ev.pointerId, [ev.clientX, ev.clientY]);
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      d0 = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1;
      z0 = z;
    }
  };
  img.onpointermove = ev => {
    const p = pts.get(ev.pointerId);
    if (!p) return;
    pts.set(ev.pointerId, [ev.clientX, ev.clientY]);
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      sz(z0 * Math.hypot(a[0] - b[0], a[1] - b[1]) / d0);
    } else if (z > 1) {
      x += ev.clientX - p[0];
      y += ev.clientY - p[1];
      ap();
    }
  };
  img.onpointerup = img.onpointercancel = ev => pts.delete(ev.pointerId);
}
