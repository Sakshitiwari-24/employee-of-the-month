<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏆 Employee of the Month — Voting & Recognition</title>
<!-- Open Graph tags for WhatsApp preview -->
<meta property="og:title" content="🏆 Employee of the Month — Voting & Recognition">
<meta property="og:description" content="Cast your vote for Employee of the Month, give compliments, and see the winner!">
<meta property="og:type" content="website">
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --ink: #0f172a;
  --mute: #64748b;
  --line: #e2e8f0;
  --acc: #ea580c;
  --acc-hover: #c2410c;
  --acc2: #ffedd5;
  --ok: #16a34a;
  --ok-bg: #dcfce7;
  --warn: #ca8a04;
  --warn-bg: #fef9c3;
  --wa: #25d366;
  --gold: #f59e0b;
  --gold-bg: #fef3c7;
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --ink: #f8fafc;
    --mute: #94a3b8;
    --line: #334155;
    --acc: #f97316;
    --acc-hover: #fb923c;
    --acc2: #431407;
    --ok: #22c55e;
    --ok-bg: #064e3b;
    --warn: #facc15;
    --warn-bg: #422006;
    --gold: #fbbf24;
    --gold-bg: #451a03;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.5;
  padding-bottom: 60px;
}
main {
  max-width: 960px;
  margin: 0 auto;
  padding: 16px 14px 40px;
}
h1 {
  margin: 0;
  font-size: 1.45rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.sub {
  color: var(--mute);
  font-size: 0.85rem;
  margin-top: 2px;
}

/* Header bar */
.header-bar {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 16px;
  background: var(--card);
  padding: 14px 16px;
  border-radius: 18px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
@media (min-width: 640px) {
  .header-bar {
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
  }
}
.header-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.pill {
  background: var(--acc2);
  color: var(--acc);
  border-radius: 9999px;
  padding: 5px 12px;
  font-size: 0.82rem;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.gold { background: var(--gold-bg); color: var(--gold); border: 1px solid var(--gold); }

.btn-wa {
  background: #25d366;
  color: #fff;
  border: 0;
  border-radius: 9999px;
  padding: 6px 14px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  box-shadow: 0 2px 5px rgba(37, 211, 102, 0.3);
  transition: transform 0.15s ease, background 0.15s ease;
}
.btn-wa:hover {
  background: #1eb956;
  transform: translateY(-1px);
}
.btn-wa svg {
  width: 17px;
  height: 17px;
  fill: currentColor;
}

.btn-winner-nav {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #fff;
  border: 0;
  border-radius: 9999px;
  padding: 6px 14px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 8px rgba(245, 158, 11, 0.35);
  transition: transform 0.15s ease;
}
.btn-winner-nav:hover {
  transform: translateY(-1px);
}

.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.panel h3 {
  margin: 0 0 10px;
  font-size: 1.05rem;
  font-weight: 700;
}
.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
input, textarea, select {
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  color: var(--ink);
  font: inherit;
  font-size: 15px;
  flex: 1;
  min-width: 140px;
  outline: none;
  transition: border-color 0.2s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--acc);
}
textarea {
  width: 100%;
  min-height: 90px;
  resize: vertical;
}

button {
  cursor: pointer;
  border: 0;
  border-radius: 10px;
  padding: 10px 16px;
  min-height: 40px;
  font-weight: 700;
  font-size: 0.9rem;
  background: var(--acc);
  color: #fff;
  transition: opacity 0.15s, transform 0.1s, background 0.15s;
}
button:hover:not(:disabled) {
  background: var(--acc-hover);
}
button:active:not(:disabled) {
  transform: scale(0.98);
}
button.g {
  background: transparent;
  color: var(--mute);
  border: 1px solid var(--line);
}
button.g:hover:not(:disabled) {
  background: var(--bg);
  color: var(--ink);
}
button.danger {
  background: #ef4444;
  color: #fff;
}
button.danger:hover:not(:disabled) {
  background: #dc2626;
}
button.sm {
  min-height: 32px;
  padding: 5px 10px;
  font-size: 0.8rem;
}
button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Auth Gateway Tabs */
.auth-box {
  background: var(--card);
  border: 2px solid var(--acc2);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-lg);
}
.auth-tabs {
  display: flex;
  border-bottom: 2px solid var(--line);
  margin-bottom: 16px;
  gap: 8px;
}
.auth-tab {
  padding: 10px 18px;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  background: transparent;
  border: 0;
  border-bottom: 3px solid transparent;
  color: var(--mute);
  border-radius: 0;
  min-height: auto;
  transition: color 0.15s, border-color 0.15s;
}
.auth-tab.active {
  color: var(--acc);
  border-bottom-color: var(--acc);
}

/* Logged-In User Banner */
.voter-profile-bar {
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 5px solid var(--ok);
  border-radius: 18px;
  padding: 14px 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
@media (min-width: 640px) {
  .voter-profile-bar {
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
  }
}

/* Callout instruction banner */
.instruction-banner {
  background: linear-gradient(135deg, #fff7ed, #ffedd5);
  border: 1px solid #fed7aa;
  color: #9a3412;
  border-radius: 14px;
  padding: 12px 16px;
  margin-bottom: 16px;
  font-size: 0.92rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
@media (prefers-color-scheme: dark) {
  .instruction-banner {
    background: #431407;
    border-color: #7c2d12;
    color: #fdba74;
  }
}

/* Grid Layout for Cards */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media (min-width: 640px) {
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
    gap: 16px;
  }
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 16px 10px 14px;
  text-align: center;
  position: relative;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: transform 0.2s, box-shadow 0.2s;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}
.card.win {
  border: 2px solid var(--gold);
  background: linear-gradient(180deg, var(--gold-bg) 0%, var(--card) 60px);
  box-shadow: 0 8px 25px rgba(245, 158, 11, 0.25);
}
.card.is-me {
  border: 2px solid var(--ok);
}
.badge-me {
  position: absolute;
  top: 8px;
  right: 8px;
  background: var(--ok);
  color: #fff;
  border-radius: 9999px;
  padding: 2px 8px;
  font-size: 0.7rem;
  font-weight: 800;
}
.av {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  object-fit: cover;
  margin: 0 auto 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--acc2);
  color: var(--acc);
  font-size: 1.8rem;
  font-weight: 800;
  border: 3px solid var(--line);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
}
img.av { cursor: zoom-in; }
.nm {
  font-weight: 800;
  font-size: 1.05rem;
  margin-top: 4px;
  line-height: 1.25;
}
.rl {
  color: var(--mute);
  font-size: 0.8rem;
  margin-top: 3px;
  margin-bottom: 8px;
  min-height: 2.2em;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cnt {
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--acc);
  margin-bottom: 6px;
}
.crown {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #fff;
  border-radius: 9999px;
  padding: 3px 12px;
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
  white-space: nowrap;
}

/* Card Buttons Container */
.card-actions {
  width: 100%;
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

/* The Distinct Vote Button */
.btn-vote {
  width: 100%;
  padding: 9px 8px;
  font-size: 0.88rem;
  font-weight: 800;
  background: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
  color: #fff;
  border: 0;
  border-radius: 10px;
  box-shadow: 0 3px 6px rgba(234, 88, 12, 0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-vote:hover:not(:disabled) {
  background: linear-gradient(135deg, #c2410c 0%, #ea580c 100%);
}
.btn-vote.btn-confirm {
  background: #dc2626 !important;
  animation: pulse 1s infinite alternate;
  box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
}
@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.03); }
}

/* The Distinct Feedback Button */
.btn-fb {
  width: 100%;
  padding: 7px 8px;
  font-size: 0.8rem;
  font-weight: 600;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-fb:hover {
  background: var(--line);
}

/* Celebratory Winner Banner */
.winner-showcase {
  text-align: center;
  padding: 26px 16px;
  border-radius: 24px;
  background: linear-gradient(135deg, #ea580c 0%, #f59e0b 50%, #fbbf24 100%);
  color: #fff;
  margin-bottom: 20px;
  box-shadow: 0 12px 30px rgba(234, 88, 12, 0.35);
  position: relative;
  overflow: hidden;
}
.winner-showcase h2 {
  margin: 8px 0 4px;
  font-size: 2rem;
  font-weight: 900;
  text-shadow: 0 2px 4px rgba(0,0,0,0.15);
}
.winner-avatar-big {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  object-fit: cover;
  margin: 10px auto 10px;
  border: 4px solid #fff;
  box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  color: #ea580c;
  font-size: 2.5rem;
  font-weight: 900;
}
.winner-sub {
  font-size: 1.05rem;
  opacity: 0.95;
  font-weight: 700;
}

/* Leaderboard */
.leaderboard-table {
  width: 100%;
  margin-top: 10px;
  border-collapse: collapse;
}
.leaderboard-table td, .leaderboard-table th {
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  font-size: 0.9rem;
}
.leaderboard-table tr:last-child td { border-bottom: 0; }
.rank-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  font-weight: 800;
  font-size: 0.8rem;
  background: var(--bg);
}
.rank-1 { background: #fef08a; color: #854d0e; }
.rank-2 { background: #e2e8f0; color: #475569; }
.rank-3 { background: #fed7aa; color: #9a3412; }

/* Table styles for Admin Audit */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  margin-top: 10px;
  border-radius: 12px;
  border: 1px solid var(--line);
}
table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.85rem;
}
th, td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
}
th {
  background: var(--bg);
  font-weight: 700;
  color: var(--mute);
}
tr:last-child td { border-bottom: 0; }

/* Modals */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(4px);
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 100;
}
.box {
  background: var(--card);
  border-radius: 20px;
  padding: 20px;
  max-width: 480px;
  width: 100%;
  border: 1px solid var(--line);
  box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.25);
  max-height: 90vh;
  overflow-y: auto;
  animation: modalIn 0.2s ease-out;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(12px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.seg {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}
.seg button {
  flex: 1;
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
}
.seg .on {
  background: var(--acc);
  color: #fff;
  border-color: var(--acc);
}
.fi {
  border-left: 4px solid var(--acc);
  padding: 8px 12px;
  margin: 8px 0;
  background: var(--bg);
  border-radius: 8px;
  font-size: 0.88rem;
}
.fi.c { border-color: var(--ok); }

/* Zoom view */
.zw {
  width: min(92vw, 520px);
  height: min(65vh, 520px);
  overflow: hidden;
  border-radius: 18px;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  border: 1px solid rgba(255, 255, 255, 0.15);
}
.zi {
  max-width: 100%;
  max-height: 100%;
  touch-action: none;
  user-select: none;
  transition: transform 0.05s ease-out;
}

/* Toast notification */
#toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) translateY(20px);
  background: #0f172a;
  color: #f8fafc;
  padding: 11px 20px;
  border-radius: 9999px;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  max-width: 90vw;
  text-align: center;
  font-size: 0.9rem;
  font-weight: 700;
  box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4);
}
#toast.s {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.note {
  color: var(--mute);
  font-size: 0.82rem;
  margin: 6px 0 0;
}
.footer {
  margin-top: 36px;
  text-align: center;
  border-top: 1px solid var(--line);
  padding-top: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}

.emp-manage-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 8px;
}
.emp-manage-av {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--acc2);
  color: var(--acc);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 1rem;
  flex-shrink: 0;
}
.emp-manage-info {
  flex: 1;
  min-width: 0;
}
.emp-manage-name {
  font-weight: 700;
  font-size: 0.95rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.emp-manage-role {
  color: var(--mute);
  font-size: 0.78rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style>
</head>
<body>
<main>
  <!-- Top Navigation Bar -->
  <div class="header-bar">
    <div>
      <h1>🏆 Employee of the Month</h1>
      <div class="sub" id="mo"></div>
    </div>
    <div class="header-actions">
      <span class="pill" id="st">Loading…</span>
      <button class="btn-winner-nav" id="view-winner-btn">🏆 Winner & Results</button>
      <a href="#" class="btn-wa" id="wa-share" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M12.031 2C6.495 2 2 6.495 2 12.031c0 1.97.57 3.81 1.558 5.37L2 22l4.757-1.528A9.97 9.97 0 0 0 12.031 22c5.536 0 10.031-4.495 10.031-10.031C22.062 6.495 17.567 2 12.031 2zm5.836 14.198c-.244.686-1.42 1.258-1.954 1.341-.534.084-1.226.118-3.957-.962-3.486-1.38-5.74-4.89-5.914-5.124-.174-.233-1.412-1.879-1.412-3.585 0-1.706.892-2.545 1.21-2.894.318-.35.693-.437.925-.437.233 0 .465.002.668.012.215.01.503-.082.787.6.294.706 1.002 2.44 1.089 2.617.087.177.145.385.029.618-.116.233-.174.378-.348.583-.174.204-.367.456-.525.612-.174.174-.356.363-.153.712.204.35 1.049 1.728 2.25 2.798 1.545 1.378 2.848 1.805 3.254 2.008.407.204.646.175.885-.102.24-.277 1.026-1.196 1.3-1.608.274-.412.547-.344.92-.204.374.14 2.373 1.119 2.78 1.323.407.204.678.305.779.476.102.171.102.991-.142 1.677z"/></svg>
        Share
      </a>
    </div>
  </div>

  <!-- Winner Banner Container (if revealed) -->
  <div id="win-banner"></div>

  <!-- Step 1: Login / Register Area (When Not Logged In) OR User Header Bar (When Logged In) -->
  <div id="auth-container"></div>

  <!-- Admin Panel Mount Point (for admin only) -->
  <div id="adm"></div>

  <!-- Step 2: Candidates List & Voting Grid -->
  <div id="app">
    <div style="text-align:center;padding:32px;color:var(--mute)">Loading voting system…</div>
  </div>

  <div class="footer">
    <p class="note">🔒 Verified Participation: Staff sign in to vote. One vote per employee per month.</p>
    <div>
      <a href="#" id="alink" style="color:var(--mute);font-weight:600;font-size:0.85rem">⚙️ Admin Portal</a>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
/* -------------------------------------------------------------
   Employee of the Month — Self-Registration, Login & Voting Flow
------------------------------------------------------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function toast(t) {
  const e = $('toast');
  e.textContent = t;
  e.className = 's';
  clearTimeout(e._t);
  e._t = setTimeout(() => e.className = '', 3500);
}
const err = e => toast((e && e.message || String(e)).replace(/^Error:\s*/, ''));

const getMonthStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
};

// Initial Roster Data (starts completely clean)
const DEFAULT_DATA = {
  admin_pin: '1234',
  rev: false,
  employees: [],
  ballots: [],
  feedback: []

// Cloud & Local Storage Engine
const BLOB_URL = 'https://goqu5eu4jodzu0ws.public.blob.vercel-storage.com/eom-live-db.json';

const DB = {
  get() {
    try {
      const raw = localStorage.getItem('eom_db_v2');
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  },
  saveLocal(data) {
    try {
      localStorage.setItem('eom_db_v2', JSON.stringify(data));
    } catch(e) {}
  }
};

// Cloud API Caller
async function apiCall(action, payload = {}) {
  try {
    const res = await fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, ...payload })
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Request failed');
    if (json.db) DB.saveLocal(json.db);
    return json;
  } catch(err) {
    console.error('API call error:', err);
    throw err;
  }
}

// Fetch latest shared cloud database with instant sub-second edge sync
async function fetchCloudDb() {
  try {
    const resBlob = await fetch(BLOB_URL + '?t=' + Date.now() + '&_r=' + Math.random(), {
      cache: 'no-store',
      headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
    });
    if (resBlob.ok) {
      const data = await resBlob.json();
      if (data && Array.isArray(data.employees)) {
        DB.saveLocal(data);
        return data;
      }
    }
  } catch(e) {}

  try {
    const res = await fetch('/api/data?t=' + Date.now() + '&_r=' + Math.random(), {
      cache: 'no-store',
      headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
    });
    if (res.ok) {
      const data = await res.json();
      if (data && Array.isArray(data.employees)) {
        DB.saveLocal(data);
        return data;
      }
    }
  } catch(e2) {}

  return DB.get();
}

// Compress avatar photos to 150x150 Retina JPEG (~6KB)
function compressImage(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve('');
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Failed to read file'));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error('Invalid image file'));
      img.onload = () => {
        const size = 150;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const minDim = Math.min(img.width, img.height);
        const sx = (img.width - minDim) / 2;
        const sy = (img.height - minDim) / 2;
        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
        resolve(dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Cloud RPC Engine
const RPC = {
  async pub() {
    const db = await fetchCloudDb();
    const curMonth = getMonthStr();
    const monthBallots = (db.ballots || []).filter(b => b.month === curMonth);
    const counts = {};
    monthBallots.forEach(b => { counts[b.cid] = (counts[b.cid] || 0) + 1; });
    return {
      m: curMonth,
      rev: !!db.rev,
      total: monthBallots.length,
      counts: db.rev ? counts : {},
      emps: db.employees || []
    };
  },

  async empRegister(p_name, p_role, p_photo, p_pin) {
    const res = await apiCall('register', { data: { name: p_name, role: p_role, photo: p_photo, pin: p_pin } });
    return res.emp;
  },
  
  async empLogin(p_eid, p_pin) {
    const db = await fetchCloudDb();
    const emp = db.employees.find(e => e.id === p_eid);
    if (!emp) throw new Error('Employee profile not found');
    const enteredPin = String(p_pin || '').trim();
    const targetPin = String(emp.pin || '1111').trim();
    if (enteredPin !== targetPin && enteredPin !== String(db.admin_pin)) {
      throw new Error('Wrong PIN for this employee account');
    }
    const curMonth = getMonthStr();
    const vote = (db.ballots || []).find(b => b.month === curMonth && b.voter_id === emp.id);
    return {
      emp,
      hasVoted: !!vote,
      votedForId: vote ? vote.cid : null,
      votedForName: vote ? vote.cname : null,
      votedTime: vote ? vote.timestamp : null
    };
  },

  async empVote(p_voter_id, p_cid) {
    const res = await apiCall('vote', { data: { voter_id: p_voter_id, cid: p_cid } });
    return res;
  },

  async fb(p_voter_id, p_eid, p_kind, p_text) {
    const res = await apiCall('feedback', { data: { voter_id: p_voter_id, eid: p_eid, kind: p_kind, text: p_text } });
    return res;
  },

  async adm(p_pin) {
    const db = await fetchCloudDb();
    if (String(p_pin || '').trim() !== String(db.admin_pin)) {
      throw new Error('Wrong admin PIN');
    }
    const curMonth = getMonthStr();
    const monthBallots = (db.ballots || []).filter(b => b.month === curMonth);
    const counts = {};
    monthBallots.forEach(b => { counts[b.cid] = (counts[b.cid] || 0) + 1; });
    
    const votedIds = new Set(monthBallots.map(b => b.voter_id));
    const votedList = monthBallots.map(b => ({
      voter_id: b.voter_id,
      voter_name: b.voter_name,
      cid: b.cid,
      cname: b.cname,
      timestamp: b.timestamp
    }));
    const pendingList = (db.employees || []).filter(e => !votedIds.has(e.id)).map(e => ({
      id: e.id,
      name: e.name,
      role: e.role
    }));

    const fbList = (db.feedback || []).filter(f => f.month === curMonth);

    return {
      adminPin: db.admin_pin,
      counts,
      total: monthBallots.length,
      employees: db.employees || [],
      votedList,
      pendingList,
      fb: fbList
    };
  },

  async changeAdminPin(p_old_pin, p_new_pin) {
    const res = await apiCall('change_pin', { pin: p_old_pin, new_pin: p_new_pin });
    return res.admin_pin;
  },

  async addEmp(p_pin, p_name, p_role, p_photo) {
    const res = await apiCall('add_emp', { pin: p_pin, name: p_name, role: p_role, photo: p_photo });
    return res.emp;
  },

  async editEmp(p_pin, p_id, p_name, p_role, p_photo, p_emp_pin) {
    const res = await apiCall('edit_emp', { pin: p_pin, id: p_id, name: p_name, role: p_role, photo: p_photo, emp_pin: p_emp_pin });
    return res.emp;
  },

  async delEmp(p_pin, p_id) {
    const res = await apiCall('del_emp', { pin: p_pin, id: p_id });
    return res;
  },

  async setRev(p_pin, p_on) {
    const res = await apiCall('set_rev', { pin: p_pin, rev: p_on });
    return res.rev;
  },

  async resetDemo(p_pin) {
    const res = await apiCall('reset', { pin: p_pin });
    return res;
  }
};

// Voting execution
async function doVote(candidateId) {
  if (!curVoter) {
    toast('Please sign in or register above to cast your vote!');
    const ac = $('auth-container');
    if (ac) ac.scrollIntoView({ behavior: 'smooth' });
    return;
  }
  if (armed !== candidateId) return arm(candidateId);
  armed = null;

  try {
    const res = await run('empVote', curVoter.id, candidateId);
    voterState.hasVoted = true;
    voterState.votedForId = res.candidateId;
    voterState.votedForName = res.candidateName;
    voterState.votedTime = res.timeStr;
    toast(`🎉 Congratulations! Your vote for ${res.candidateName} is recorded!`);
    await load();
  } catch(e) {
    err(e);
    await load();
  }
}

// Delete Employee
async function doDel(id) {
  if (armed !== 'd' + id) return arm('d' + id);
  armed = null;
  try {
    await run('delEmp', pin, id);
    toast('Employee removed');
    await load();
  } catch(e) { err(e); }
}

// Add New Employee directly by Admin
async function addEmp() {
  const n = $('en').value.trim();
  if (!n) return toast('Please enter an employee name.');
  let p = '';
  try {
    const f = $('ep').files[0];
    if (f) p = await compressImage(f);
  } catch(e) {
    return toast('Could not read that photo file.');
  }
  try {
    await run('addEmp', pin, n, $('er').value.trim(), p);
    $('en').value = '';
    $('er').value = '';
    $('ep').value = '';
    toast('✓ Employee added and saved permanently!');
    await load();
  } catch(e) { err(e); }
}

// Touch & Pinch Photo Zoom
function openZoom(src, name) {
  let z = 1, x = 0, y = 0, d0 = 1, z0 = 1;
  const pts = new Map();
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `
    <div style="color:#fff;font-weight:800;font-size:1.1rem;text-shadow:0 2px 4px rgba(0,0,0,0.5)">${esc(name)}</div>
    <div class="zw"><img class="zi" src="${esc(src)}" alt=""></div>
    <div class="row" style="margin-top:4px">
      <button data-o>− Zoom Out</button>
      <button data-i>+ Zoom In</button>
      <button class="g" data-r style="color:#fff;border-color:rgba(255,255,255,0.4)">Reset</button>
      <button class="g" data-x style="color:#fff;border-color:rgba(255,255,255,0.4)">Close</button>
    </div>
    <div style="color:#cbd5e1;font-size:0.8rem">Pinch, double-tap, or scroll to zoom · Drag to pan</div>
  `;
  document.body.appendChild(m);

  const img = m.querySelector('.zi');
  const ap = () => { img.style.transform = `translate(${x}px,${y}px) scale(${z})`; };
  const sz = v => {
    z = Math.min(5, Math.max(1, v));
    if (z === 1) { x = 0; y = 0; }
    ap();
  };

  m.querySelector('[data-i]').onclick = () => sz(z + 0.5);
  m.querySelector('[data-o]').onclick = () => sz(z - 0.5);
  m.querySelector('[data-r]').onclick = () => sz(1);
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.onclick = ev => { if (ev.target === m) m.remove(); };

  m.querySelector('.zw').onwheel = ev => {
    ev.preventDefault();
    sz(z + (ev.deltaY < 0 ? 0.3 : -0.3));
  };
  img.ondblclick = () => sz(z > 1 ? 1 : 2.5);

  img.onpointerdown = ev => {
    img.setPointerCapture(ev.pointerId);
    pts.set(ev.pointerId, [ev.clientX, ev.clientY]);
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      d0 = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1;
      z0 = z;
    }
  };
  img.onpointermove = ev => {
    const p = pts.get(ev.pointerId);
    if (!p) return;
    pts.set(ev.pointerId, [ev.clientX, ev.clientY]);
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      sz(z0 * Math.hypot(a[0] - b[0], a[1] - b[1]) / d0);
    } else if (z > 1) {
      x += ev.clientX - p[0];
      y += ev.clientY - p[1];
      ap();
    }
  };
  img.onpointerup = img.onpointercancel = ev => pts.delete(ev.pointerId);
}

  m.innerHTML = `
    <div class="box">
      <h3 style="margin:0 0 12px">⚙️ Admin Authentication</h3>
      <div class="row">
        <input id="ap" type="password" placeholder="" autofocus style="font-size:16px">
        <button data-s>Sign In</button>
        <button class="g" data-c>Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(m);
  m.querySelector('[data-c]').onclick = () => m.remove();
  m.querySelector('[data-s]').onclick = async () => {
    pin = m.querySelector('#ap').value;
    try {
      A = await run('adm', pin);
      m.remove();
      toast('Admin session opened');
      render();
    } catch(x) {
      pin = null;
      err(x);
    }
  };
};

// Real-time Cloud Sync: Polling every 4 seconds so all phones/laptops stay automatically in sync
setInterval(() => {
  const activeTag = document.activeElement ? document.activeElement.tagName : '';
  if (activeTag !== 'INPUT' && activeTag !== 'TEXTAREA') {
    load(true);
  }
}, 4000);

window.addEventListener('focus', () => {
  load(true);
});

// Initial run
load();
</script>
</body>
</html>
